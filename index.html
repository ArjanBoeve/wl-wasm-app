<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}

<script src="sql-wasm.js"></script>

<script>
let db;
let SQL;

console.log("start WASM SQLite");

window.sqliteReady = false;

initSqlJs({
    locateFile: file => `sql-wasm.wasm`
}).then(sql => {
    SQL = sql;
    db = new SQL.Database();
    console.log("SQLite WASM ready");
    window.sqliteReady = true;
});

window.execSql = function(query) {
    if (!db) {
        console.error("DB is not initialized");
        return "";
    }

    try {
        const result = db.exec(query);
        console.log("execSql ok");
        return JSON.stringify(result);   // ALWAYS a string
    } catch (e) {
        console.error("SQL ERROR:", e);
        console.log("execSql err");
        return "";
    }
};



window.loadFromIndexedDB = function() {

console.log("loadFromIndexedDB");


    return new Promise((resolve, reject) => {
        const request = indexedDB.open("MySQLiteDB", 1);

        request.onupgradeneeded = () => {
            request.result.createObjectStore("files");
        };

        request.onsuccess = () => {
            const tx = request.result.transaction("files", "readonly");
            const getReq = tx.objectStore("files").get("database");

            getReq.onsuccess = () => {
                if (getReq.result) {
                    resolve(new SQL.Database(getReq.result));
                } else {
                    resolve(null);
                }
            };

            getReq.onerror = reject;
        };
console.log("loadFromIndexedDB   2");

        request.onerror = reject;
    });
};

window.OpenDb = async function() {
    db = await loadFromIndexedDB();
    if (!db) {
        db = new SQL.Database();
    }
};

window.saveToIndexedDB = function() {

	
	console.log("SQLite WASM saveToIndexedDB");
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("MySQLiteDB", 1);

        request.onupgradeneeded = () => {
            request.result.createObjectStore("files");
        };

        request.onsuccess = () => {
            const dbFile = db.export();
            const tx = request.result.transaction("files", "readwrite");
            tx.objectStore("files").put(dbFile, "database");
            tx.oncomplete = resolve;
            tx.onerror = reject;
        };

        request.onerror = reject;
    });
};

window.CloseDb = async function() {

	console.log("SQLite WASM CloseDb");
    await saveToIndexedDB();
};
</script>


<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>gui_wl2</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="smartwinch.svg" width="320" height="200" style="display:block"></img>
        <strong>SmartWinch gui_wl2</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.gui_wl2_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="gui_wl2.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
